<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mentor &amp; Contact Roster</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📇</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,650;1,9..144,500&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241f19;
    --ink-soft:#54493d;
    --paper:#efeae1;
    --paper-raised:#f8f5ee;
    --line:#d8d0c0;
    --brick:#8c2a2a;
    --brick-deep:#6e1f1f;
    --gold:#a9823b;
    --pine:#4c5f48;
    --slate:#3f5566;
    --plum:#6a4e63;
    --ok-bg:#eef2e8;
    font-family:'Public Sans',sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#efe8db;
      --ink-soft:#c8bba3;
      --paper:#211a14;
      --paper-raised:#2a2119;
      --line:#443828;
      --brick:#c75c4e;
      --brick-deep:#a6483c;
      --gold:#d9ac5b;
      --pine:#89a47f;
      --slate:#7fa0b8;
      --plum:#b393a9;
      --ok-bg:#2b3328;
    }
  }
  :root[data-theme="dark"]{
    --ink:#efe8db;
    --ink-soft:#c8bba3;
    --paper:#211a14;
    --paper-raised:#2a2119;
    --line:#443828;
    --brick:#c75c4e;
    --brick-deep:#a6483c;
    --gold:#d9ac5b;
    --pine:#89a47f;
    --slate:#7fa0b8;
    --plum:#b393a9;
    --ok-bg:#2b3328;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{min-height:100%;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}

  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(180deg,#2c1d14,#241711);
    color:#f2ead9;
    padding:28px clamp(16px,4vw,48px) 24px;
    border-bottom:4px solid var(--gold);
  }
  header.top .eyebrow-row{
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px 24px;
  }
  header.top h1{
    font-size:clamp(28px,4vw,40px);
    font-weight:650;
    margin:0;
    letter-spacing:.2px;
  }
  header.top p.tag{
    margin:6px 0 0;
    color:#cdbfa2;
    font-size:14.5px;
    max-width:62ch;
  }
  .count-pill{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:#f2ead9;
    border:1px solid #6a5a44;
    padding:6px 14px;
    border-radius:3px;
    white-space:nowrap;
  }
  .count-pill b{color:#e7c77e;font-weight:650;}

  /* ---------- Layout ---------- */
  .shell{
    display:grid;
    grid-template-columns: 272px 1fr;
    gap:0;
    max-width:1400px;
    margin:0 auto;
  }
  @media (max-width: 880px){
    .shell{grid-template-columns:1fr;}
  }

  /* ---------- Sidebar ---------- */
  aside{
    padding:26px 20px 60px;
    border-right:1px solid var(--line);
    background:var(--paper-raised);
  }
  @media (max-width:880px){
    aside{border-right:none;border-bottom:1px solid var(--line);}
  }
  .search-box{
    position:relative;
    margin-bottom:22px;
  }
  .search-box input{
    width:100%;
    padding:10px 12px 10px 34px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    font-size:14.5px;
    font-family:'Public Sans',sans-serif;
    color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--brick);outline-offset:1px;}
  .search-box svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55;}

  .side-section{margin-bottom:26px;}
  .side-section h3{
    font-size:12.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    font-family:'Public Sans',sans-serif;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0 10px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .side-section h3 button{
    font-family:'Public Sans',sans-serif;
    font-size:11px;
    text-transform:none;
    letter-spacing:0;
    font-weight:600;
    background:none;border:none;color:var(--brick);cursor:pointer;padding:0;
  }
  .cat-list{list-style:none;margin:0;padding:0;}
  .cat-list li{margin-bottom:4px;}
  .cat-btn{
    width:100%;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:none;border:none;
    padding:7px 8px;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    font-family:'Public Sans',sans-serif;
    color:var(--ink);
    text-align:left;
  }
  .cat-btn:hover{background:var(--ok-bg);}
  .cat-btn.active{background:var(--ink);color:#fff;}
  .cat-btn .swatch{width:9px;height:9px;border-radius:2px;flex:none;}
  .cat-btn .num{font-variant-numeric:tabular-nums;opacity:.65;font-size:12.5px;}
  .cat-btn.active .num{opacity:.85;}

  .tag-cloud{display:flex;flex-wrap:wrap;gap:6px;}
  .tag-chip{
    font-size:12.5px;
    padding:4px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    color:var(--ink-soft);
    line-height:1.3;
  }
  .tag-chip:hover{border-color:var(--brick);color:var(--brick);}
  .tag-chip.active{background:var(--brick);border-color:var(--brick);color:#fff;}
  .tag-search{
    width:100%;
    padding:6px 9px;
    font-size:12.5px;
    border:1px solid var(--line);
    border-radius:4px;
    margin-bottom:8px;
    font-family:'Public Sans',sans-serif;
  }
  .tag-cloud-scroll{max-height:230px;overflow-y:auto;padding-right:4px;}

  .reset-link{
    font-size:12.5px;color:var(--brick);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;
  }

  /* ---------- Main ---------- */
  main{padding:24px clamp(14px,3vw,34px) 70px;}
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .active-filters{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; color:var(--ink-soft);
  }
  .active-filters .f-chip{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 10px 3px 10px;
    display:flex; align-items:center; gap:6px;
  }
  .active-filters .f-chip button{background:none;border:none;cursor:pointer;color:var(--ink-soft);font-size:13px;line-height:1;}

  .sort-select{
    font-family:'Public Sans',sans-serif;
    font-size:13px;
    padding:7px 10px;
    border:1px solid var(--line);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:14px;
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--brick);
    border-radius:3px;
    padding:15px 16px 14px;
    cursor:pointer;
    display:flex; flex-direction:column; gap:7px;
    transition:border-color .12s, transform .08s;
  }
  .card:hover{border-color:var(--ink);}
  .card:hover{transform:translateY(-1px);}
  .card .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card h3{margin:0;font-size:18px;font-weight:560;line-height:1.25;}
  .card .star{
    background:none;border:none;cursor:pointer;font-size:16px;line-height:1;color:var(--line);flex:none;
  }
  .card .star.on{color:var(--gold);}
  .card .meta{font-size:13px;color:var(--ink-soft);line-height:1.45;}
  .card .meta .school{font-weight:600;color:var(--ink);}
  .card .cat-badge{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:2px 7px;
    border-radius:3px;
    width:fit-content;
  }
  .card .chiprow{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
  .card .mini-tag{
    font-size:11px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px 8px;
    color:var(--ink-soft);
  }
  .card .mini-tag.custom{border-color:var(--pine);color:var(--pine);}
  .card .mini-tag.more{color:var(--ink-soft);border-style:dashed;}

  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-soft);
  }
  .empty-state h2{margin-bottom:6px;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(27,19,12,.45);
    display:none;align-items:flex-start;justify-content:center;
    padding:5vh 16px; overflow-y:auto; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-top:5px solid var(--brick);
    max-width:620px;width:100%;
    border-radius:4px;
    padding:28px 28px 26px;
    position:relative;
  }
  .modal .close-x{
    position:absolute; top:14px; right:16px;
    background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);
  }
  .modal h2{margin:0 0 4px;font-size:25px;}
  .modal .modal-meta{color:var(--ink-soft);font-size:14.5px;margin-bottom:14px;}
  .modal .field-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px 20px; margin:16px 0;
  }
  .modal .field{font-size:13.5px;}
  .modal .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:2px;font-weight:700;}
  .modal .field div{color:var(--ink);}
  .modal .notes-box{
    background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:14px;margin-top:4px;white-space:pre-wrap;
  }
  .modal .tag-edit{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .modal .tag-edit .tag-chip{position:relative;padding-right:22px;}
  .modal .tag-edit .tag-chip .x{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;
  }
  .modal .add-tag-row{display:flex;gap:6px;margin-top:8px;}
  .modal .add-tag-row input{
    flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:4px;font-size:13.5px;font-family:'Public Sans',sans-serif;
  }
  .modal .add-tag-row button{
    padding:7px 14px;background:var(--ink);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13.5px;font-family:'Public Sans',sans-serif;
  }
  .modal .mail-btn{
    display:inline-block;margin-top:4px;background:var(--brick);color:#fff;text-decoration:none;
    padding:8px 16px;border-radius:4px;font-size:14px;font-weight:600;
  }
  .modal .private-note{
    width:100%;min-height:70px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;
    font-family:'Public Sans',sans-serif;font-size:13.5px;resize:vertical;margin-top:4px;
  }
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin:16px 0 4px;}

  ::-webkit-scrollbar{width:9px;}
  ::-webkit-scrollbar-thumb{background:#c9bfa9;border-radius:5px;}
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow-row">
    <div>
      <h1>Mentor &amp; Contact Roster</h1>
      <p class="tag">Mentors, school partners, and university contacts — searchable, taggable, all in one place.</p>
    </div>
    <div class="count-pill"><b id="visibleCount">0</b> of <span id="totalCount">0</span> contacts shown</div>
  </div>
</header>

<div class="shell">
  <aside>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Search name, school, district, notes…">
    </div>

    <div class="side-section">
      <h3>Category <button id="resetCats">reset</button></h3>
      <ul class="cat-list" id="catList"></ul>
    </div>

    <div class="side-section">
      <h3>Tags <button id="resetTags">reset</button></h3>
      <input type="text" class="tag-search" id="tagSearch" placeholder="Filter tags…">
      <div class="tag-cloud tag-cloud-scroll" id="tagCloud"></div>
    </div>

    <div class="side-section">
      <h3>★ Favorites</h3>
      <label style="font-size:13.5px;display:flex;gap:7px;align-items:center;cursor:pointer;">
        <input type="checkbox" id="favOnly"> Show favorites only
      </label>
    </div>

    <button class="reset-link" id="resetAll" style="margin-top:4px;">Clear all filters</button>
  </aside>

  <main>
    <div class="toolbar">
      <div class="active-filters" id="activeFilters"></div>
      <select class="sort-select" id="sortSelect">
        <option value="name">Sort: Last name A–Z</option>
        <option value="school">Sort: School A–Z</option>
        <option value="category">Sort: Category</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <h2>No contacts match</h2>
      <p>Try clearing a filter or adjusting your search.</p>
    </div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
(function(){
  "use strict";

  var RAW = JSON.parse(document.getElementById('contact-data').textContent);

  var CATS = [
    {name:"Current Mentor", color:"#8c2a2a"},
    {name:"Up and Coming Mentor", color:"#a9823b"},
    {name:"Former Mentor", color:"#6a4e63"},
    {name:"Other K-12 Contact", color:"#3f5566"},
    {name:"Brown University Contact", color:"#4c5f48"}
  ];
  var CAT_COLOR = {};
  CATS.forEach(function(c){ CAT_COLOR[c.name] = c.color; });

  // ---------- local storage (per-browser personalization) ----------
  var STORE_KEY = "mentorRosterLocalData.v1";
  var local = {};
  try{
    local = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
  }catch(e){ local = {}; }
  if(!local.customTags) local.customTags = {};   // id -> [tags]
  if(!local.favorites) local.favorites = {};      // id -> true
  if(!local.privateNotes) local.privateNotes = {}; // id -> text

  function saveLocal(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(local)); }catch(e){}
  }

  function allTagsFor(contact){
    var extra = local.customTags[contact.id] || [];
    return contact.tags.concat(extra);
  }

  // ---------- state ----------
  var state = {
    search:"",
    activeCats: new Set(CATS.map(function(c){return c.name;})),
    activeTags: new Set(),
    favOnly:false,
    sort:"name",
    tagFilter:""
  };

  // ---------- tag frequency (base + custom) ----------
  function computeTagCounts(){
    var counts = {};
    RAW.forEach(function(c){
      allTagsFor(c).forEach(function(t){
        counts[t] = (counts[t]||0)+1;
      });
    });
    return counts;
  }

  // ---------- DOM refs ----------
  var $ = function(id){ return document.getElementById(id); };
  var catListEl = $('catList');
  var tagCloudEl = $('tagCloud');
  var gridEl = $('grid');
  var emptyStateEl = $('emptyState');
  var activeFiltersEl = $('activeFilters');
  var visibleCountEl = $('visibleCount');
  var totalCountEl = $('totalCount');

  totalCountEl.textContent = RAW.length;

  // ---------- render category list ----------
  function renderCats(){
    catListEl.innerHTML = "";
    var counts = {};
    RAW.forEach(function(c){ counts[c.category] = (counts[c.category]||0)+1; });
    CATS.forEach(function(cat){
      var li = document.createElement('li');
      var btn = document.createElement('button');
      btn.className = 'cat-btn' + (state.activeCats.has(cat.name) ? ' active' : '');
      btn.innerHTML = '<span style="display:flex;align-items:center;gap:8px;"><span class="swatch" style="background:'+cat.color+'"></span>'+cat.name+'</span><span class="num">'+(counts[cat.name]||0)+'</span>';
      btn.onclick = function(){
        if(state.activeCats.has(cat.name)){
          if(state.activeCats.size > 1) state.activeCats.delete(cat.name);
          else { CATS.forEach(function(c){state.activeCats.add(c.name);}); state.activeCats = new Set([cat.name]); }
        } else {
          state.activeCats.add(cat.name);
        }
        renderAll();
      };
      li.appendChild(btn);
      catListEl.appendChild(li);
    });
  }

  // ---------- render tag cloud ----------
  function renderTagCloud(){
    var counts = computeTagCounts();
    var tags = Object.keys(counts).sort(function(a,b){
      return counts[b]-counts[a] || a.localeCompare(b);
    });
    var filterText = state.tagFilter.toLowerCase();
    if(filterText){
      tags = tags.filter(function(t){ return t.toLowerCase().indexOf(filterText) > -1; });
    }
    tagCloudEl.innerHTML = "";
    tags.forEach(function(t){
      var chip = document.createElement('button');
      chip.className = 'tag-chip' + (state.activeTags.has(t) ? ' active' : '');
      chip.textContent = t + ' (' + counts[t] + ')';
      chip.onclick = function(){
        if(state.activeTags.has(t)) state.activeTags.delete(t);
        else state.activeTags.add(t);
        renderAll();
      };
      tagCloudEl.appendChild(chip);
    });
  }

  // ---------- filtering ----------
  function matches(c){
    if(!state.activeCats.has(c.category)) return false;
    if(state.favOnly && !local.favorites[c.id]) return false;
    if(state.activeTags.size){
      var tags = allTagsFor(c);
      for(var t of state.activeTags){
        if(tags.indexOf(t) === -1) return false;
      }
    }
    if(state.search){
      var hay = [
        c.name, c.school, c.district, c.email, c.notes,
        Object.values(c.fields||{}).join(' '),
        allTagsFor(c).join(' '),
        local.privateNotes[c.id]||''
      ].join(' ').toLowerCase();
      if(hay.indexOf(state.search.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function sortFn(a,b){
    if(state.sort === 'school') return (a.school||'').localeCompare(b.school||'');
    if(state.sort === 'category') return a.category.localeCompare(b.category) || lastName(a).localeCompare(lastName(b));
    return lastName(a).localeCompare(lastName(b));
  }
  function lastName(c){
    var parts = c.name.trim().split(' ');
    return parts.length>1 ? parts[parts.length-1] : c.name;
  }

  // ---------- active filter chips ----------
  function renderActiveFilters(){
    activeFiltersEl.innerHTML = "";
    var anyPartialCats = state.activeCats.size < CATS.length;
    if(anyPartialCats){
      CATS.forEach(function(cat){
        if(!state.activeCats.has(cat.name)) return;
        if(state.activeCats.size === CATS.length) return;
      });
    }
    state.activeTags.forEach(function(t){
      var chip = document.createElement('span');
      chip.className = 'f-chip';
      chip.innerHTML = '<span>#'+t+'</span>';
      var x = document.createElement('button');
      x.textContent = '✕';
      x.onclick = function(){ state.activeTags.delete(t); renderAll(); };
      chip.appendChild(x);
      activeFiltersEl.appendChild(chip);
    });
    if(state.favOnly){
      var chip2 = document.createElement('span');
      chip2.className = 'f-chip';
      chip2.innerHTML = '<span>★ favorites</span>';
      var x2 = document.createElement('button');
      x2.textContent = '✕';
      x2.onclick = function(){ state.favOnly = false; $('favOnly').checked=false; renderAll(); };
      chip2.appendChild(x2);
      activeFiltersEl.appendChild(chip2);
    }
  }

  // ---------- card rendering ----------
  function cardHTML(c){
    var color = CAT_COLOR[c.category] || '#8c2a2a';
    var tags = allTagsFor(c);
    var shown = tags.slice(0,4);
    var customSet = {};
    (local.customTags[c.id]||[]).forEach(function(t){ customSet[t]=true; });
    var chipHtml = shown.map(function(t){
      return '<span class="mini-tag'+(customSet[t]?' custom':'')+'">'+escapeHtml(t)+'</span>';
    }).join('');
    if(tags.length > 4){
      chipHtml += '<span class="mini-tag more">+'+(tags.length-4)+'</span>';
    }
    var metaLine = [c.school, c.district].filter(Boolean).join(' · ');
    var isFav = !!local.favorites[c.id];
    return (
      '<div class="row1">'+
        '<h3>'+escapeHtml(c.name)+'</h3>'+
        '<button class="star'+(isFav?' on':'')+'" data-fav="'+c.id+'" title="Favorite">'+(isFav?'★':'☆')+'</button>'+
      '</div>'+
      '<span class="cat-badge" style="background:'+color+'22;color:'+color+'">'+c.category+'</span>'+
      (metaLine ? '<div class="meta"><span class="school">'+escapeHtml(metaLine)+'</span></div>' : '')+
      '<div class="chiprow">'+chipHtml+'</div>'
    );
  }

  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  function renderGrid(){
    var list = RAW.filter(matches).sort(sortFn);
    visibleCountEl.textContent = list.length;
    gridEl.innerHTML = "";
    if(list.length === 0){
      emptyStateEl.style.display = 'block';
      return;
    }
    emptyStateEl.style.display = 'none';
    list.forEach(function(c){
      var card = document.createElement('div');
      card.className = 'card';
      card.style.borderLeftColor = CAT_COLOR[c.category] || '#8c2a2a';
      card.innerHTML = cardHTML(c);
      card.addEventListener('click', function(e){
        if(e.target.closest('[data-fav]')) return;
        openModal(c);
      });
      var starBtn = card.querySelector('[data-fav]');
      starBtn.addEventListener('click', function(e){
        e.stopPropagation();
        local.favorites[c.id] = !local.favorites[c.id];
        saveLocal();
        renderAll();
      });
      gridEl.appendChild(card);
    });
  }

  // ---------- modal ----------
  var overlay = $('overlay');
  var modal = $('modal');

  function openModal(c){
    var color = CAT_COLOR[c.category] || '#8c2a2a';
    var fieldsHtml = "";
    Object.keys(c.fields||{}).forEach(function(k){
      var v = c.fields[k];
      if(!v) return;
      fieldsHtml += '<div class="field"><label>'+escapeHtml(k)+'</label><div>'+escapeHtml(v)+'</div></div>';
    });
    var tags = allTagsFor(c);
    var customSet = {};
    (local.customTags[c.id]||[]).forEach(function(t){ customSet[t]=true; });
    var tagEditHtml = tags.map(function(t){
      var removable = customSet[t];
      return '<span class="tag-chip active" style="background:'+(removable?'var(--pine)':color)+';border-color:'+(removable?'var(--pine)':color)+'">'+escapeHtml(t)+
        (removable ? '<span class="x" data-remove-tag="'+escapeHtml(t)+'" style="cursor:pointer;">✕</span>' : '') +
        '</span>';
    }).join('');

    modal.innerHTML =
      '<button class="close-x" id="closeModal">✕</button>'+
      '<span class="cat-badge" style="background:'+color+'22;color:'+color+'">'+c.category+'</span>'+
      '<h2 style="margin-top:8px;">'+escapeHtml(c.name)+'</h2>'+
      '<div class="modal-meta">'+escapeHtml([c.school,c.district].filter(Boolean).join(' · '))+'</div>'+
      (c.email ? '<a class="mail-btn" href="mailto:'+escapeHtml(c.email)+'">✉ '+escapeHtml(c.email)+'</a>' : '<div style="font-size:13.5px;color:var(--ink-soft);">No email on file</div>')+
      (fieldsHtml ? '<div class="section-label">Details</div><div class="field-grid">'+fieldsHtml+'</div>' : '')+
      (c.notes ? '<div class="section-label">Notes</div><div class="notes-box">'+escapeHtml(c.notes)+'</div>' : '')+
      '<div class="section-label">Tags</div>'+
      '<div class="tag-edit">'+tagEditHtml+'</div>'+
      '<div class="add-tag-row"><input type="text" id="newTagInput" placeholder="Add a tag (e.g. Follow up, Great fit)"><button id="addTagBtn">Add</button></div>'+
      '<div class="section-label">Your private notes <span style="font-weight:400;text-transform:none;letter-spacing:0;">(saved in this browser only)</span></div>'+
      '<textarea class="private-note" id="privateNoteBox" placeholder="Add a note to yourself about this contact…">'+escapeHtml(local.privateNotes[c.id]||'')+'</textarea>';

    overlay.classList.add('show');

    $('closeModal').onclick = closeModal;
    modal.querySelectorAll('[data-remove-tag]').forEach(function(el){
      el.onclick = function(ev){
        ev.stopPropagation();
        var tag = el.getAttribute('data-remove-tag');
        local.customTags[c.id] = (local.customTags[c.id]||[]).filter(function(t){return t!==tag;});
        saveLocal();
        openModal(c);
        renderTagCloud();
        renderGrid();
      };
    });
    $('addTagBtn').onclick = function(){
      var input = $('newTagInput');
      var val = input.value.trim();
      if(!val) return;
      if(!local.customTags[c.id]) local.customTags[c.id] = [];
      if(local.customTags[c.id].indexOf(val) === -1 && c.tags.indexOf(val) === -1){
        local.customTags[c.id].push(val);
        saveLocal();
        openModal(c);
        renderTagCloud();
        renderGrid();
      }
    };
    $('newTagInput').addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ $('addTagBtn').click(); }
    });
    $('privateNoteBox').addEventListener('input', function(e){
      local.privateNotes[c.id] = e.target.value;
      saveLocal();
    });
  }

  function closeModal(){
    overlay.classList.remove('show');
  }
  overlay.addEventListener('click', function(e){
    if(e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });

  // ---------- wire up static controls ----------
  $('searchInput').addEventListener('input', function(e){
    state.search = e.target.value;
    renderAll();
  });
  $('tagSearch').addEventListener('input', function(e){
    state.tagFilter = e.target.value;
    renderTagCloud();
  });
  $('favOnly').addEventListener('change', function(e){
    state.favOnly = e.target.checked;
    renderAll();
  });
  $('sortSelect').addEventListener('change', function(e){
    state.sort = e.target.value;
    renderGrid();
  });
  $('resetCats').addEventListener('click', function(){
    state.activeCats = new Set(CATS.map(function(c){return c.name;}));
    renderAll();
  });
  $('resetTags').addEventListener('click', function(){
    state.activeTags = new Set();
    renderAll();
  });
  $('resetAll').addEventListener('click', function(){
    state.search=""; $('searchInput').value="";
    state.activeCats = new Set(CATS.map(function(c){return c.name;}));
    state.activeTags = new Set();
    state.favOnly = false; $('favOnly').checked = false;
    state.tagFilter = ""; $('tagSearch').value="";
    renderAll();
  });

  function renderAll(){
    renderCats();
    renderTagCloud();
    renderActiveFilters();
    renderGrid();
  }

  renderAll();
})();

</script>
</body>
</html>
